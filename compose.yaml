name: dotty-tutor

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - 127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dotty}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-dotty_tutor}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - backend

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-dotty}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dotty_tutor}
      DOTTY_DATA_DIR: /data
      DOTTY_RUNTIME_MODE: docker
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-localhost,127.0.0.1}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-mock}
      MODEL_NAME: ${MODEL_NAME:-static-demo}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      REVIEW_PROVIDER: ${REVIEW_PROVIDER:-mock}
      REVIEW_MODEL: ${REVIEW_MODEL:-static-demo}
      TTS_PROVIDER: ${TTS_PROVIDER:-auto}
      QWEN_TTS_URL: ${QWEN_TTS_URL:-http://host.docker.internal:8020}
      AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY:-}
      AZURE_SPEECH_REGION: ${AZURE_SPEECH_REGION:-}
      AZURE_SPEECH_VOICE: ${AZURE_SPEECH_VOICE:-zh-CN-XiaoxiaoNeural}
    volumes:
      - dotty_data:/data
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8010/api/health', timeout=3)
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 12
    expose:
      - "8010"
    networks:
      - backend

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    init: true
    ports:
      - ${WEB_PORT:-8080}:80
    depends_on:
      api:
        condition: service_healthy
    networks:
      - backend

volumes:
  postgres_data:
  dotty_data:

networks:
  backend:
