# Dotty Tutor CHANGELOG configuration for git-cliff.
# https://git-cliff.org/docs/configuration

[changelog]
header = """# 变更记录

本文件遵循 Keep a Changelog 格式。条目从用户视角描述可感知的变化。

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat=\"v\") }}] - {{ timestamp | date(format=\"%Y-%m-%d\") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute=\"group\") %}\
{% if group %}\
### {{ group }}
{% for commit in commits %}\
- {% if commit.scope %}{{ commit.scope }}: {% endif %}{{ commit.message | upper_first }}
{% endfor %}\
{% endif %}\
{% endfor %}\
"""
trim = true
render_always = true

[git]
conventional_commits = true
filter_unconventional = true
require_conventional = false
split_commits = false
protect_breaking_commits = true

# Only user-visible changes are included. The final parser explicitly skips
# docs, style, chore, test, and any other commit type.
commit_parsers = [
    { message = "^feat", group = "Added" },
    { message = "^fix", group = "Fixed" },
    { message = "^perf", group = "Changed" },
    { message = "^refactor", group = "Changed" },
    { message = ".*", skip = true },
]

filter_commits = true
sort_commits = "oldest"
topo_order_commits = true
