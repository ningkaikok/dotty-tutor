name: 功能建议
description: 提议新的产品、教学或工程能力
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 问题和场景
      description: 谁在什么情况下遇到了什么问题？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述期望行为、交互或技术方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 已考虑过哪些替代方式？
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 什么条件满足时可以认为功能完成？
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 原型、截图、相关标准或参考链接
  - type: checkboxes
    id: confirmation
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issue 和路线图，确认没有重复建议
          required: true
        - label: 该建议不要求提交未授权教材、学生数据或模型密钥
          required: true
