name: Changelog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    name: Generate changelog
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate CHANGELOG.md
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --unreleased --strip header --output /tmp/dotty-unreleased.md

      - name: Update only the Unreleased section
        run: python3 scripts/merge-changelog.py /tmp/dotty-unreleased.md CHANGELOG.md

      - name: Open changelog update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/generated-changelog
          delete-branch: true
          title: "chore(changelog): update CHANGELOG.md"
          commit-message: "chore(changelog): update CHANGELOG.md"
          body: |
            This pull request was generated by git-cliff from Conventional Commits.

            Only `feat`, `fix`, `perf`, and `refactor` commits are included in the changelog.
