name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # 按改动路径决定后续 job 是否运行（规则见 scripts/ci-changed-areas.sh）。推送到 main
  # 一律全跑，作为合并后的最终兜底。必需检查 backend/frontend/docker 被条件跳过时
  # GitHub 记为通过，因此本 job 失败时下游不能被当成通过（见 backend 聚合 job）。
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      e2e: ${{ steps.filter.outputs.e2e }}
      docker: ${{ steps.filter.outputs.docker }}
      python-versions: ${{ steps.filter.outputs.python-versions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Detect affected areas
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bash scripts/ci-changed-areas.sh "$BASE_SHA" | tee -a "$GITHUB_OUTPUT"
          else
            bash scripts/ci-changed-areas.sh --all | tee -a "$GITHUB_OUTPUT"
          fi

  # 真正跑门禁的矩阵 job。它不叫 backend：矩阵会把检查名变成
  # "backend (3.12)"/"backend (3.14)"，而仓库 ruleset 要求的必需检查名是
  # 恰好的 "backend"，改名会让那个检查永远不出现、PR 永远无法合并。
  backend-matrix:
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    strategy:
      fail-fast: false
      # pyproject 声明 requires-python = ">=3.12"，矩阵覆盖支持区间的两个端点。
      # PR 默认只跑 3.12（3.14 仅在依赖或 CI 变化时加入）；每次推送到 main 都跑两个
      # 版本，3.14 的兼容问题最晚在合并后的 main 上暴露。
      matrix:
        python-version: ${{ fromJSON(needs.changes.outputs.python-versions) }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # 与本地约定一致：虚拟环境固定在仓库根目录。
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv
      DOTTY_TEST_POSTGRES_ADMIN_URL: postgresql+psycopg://postgres:ci-only-password@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      # 只用系统 Python（pyproject: python-preference=only-system），不下载解释器。
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install backend dependencies (frozen lock)
        working-directory: apps/api
        run: uv sync --frozen
      # 后续 ruff/pyright 步骤从仓库根调用，路径相对根解析
      - name: Lint backend (ruff)
        working-directory: apps/api
        run: uv run ruff check .
      - name: Check backend test discipline (no internal mock / no sleep)
        run: python scripts/check_test_discipline.py
      - name: Type check (pyright)
        run: uv --directory apps/api run pyright
      - name: Install PDF and lesson media renderers
        run: sudo apt-get update && sudo apt-get install -y poppler-utils ffmpeg libcairo2 fonts-noto-cjk fonts-dejavu-core
      # 这个 postgres 服务容器用完即弃，不需要崩溃安全。测试频繁建库/删库，刷盘是主要
      # 开销；这三项都可以热加载（pg_reload_conf），service 容器无法改启动参数。
      # 本地实测关闭后后端全量约快一倍。
      - name: Disable durability on the throwaway CI PostgreSQL
        working-directory: apps/api
        run: |
          uv run python - <<'EOF'
          import os, psycopg
          url = os.environ["DOTTY_TEST_POSTGRES_ADMIN_URL"].replace("+psycopg", "")
          with psycopg.connect(url, autocommit=True) as connection:
              for setting in ("fsync", "synchronous_commit", "full_page_writes"):
                  connection.execute(f"ALTER SYSTEM SET {setting} = off")
              connection.execute("SELECT pg_reload_conf()")
          EOF
      # 测试按模块分给多个进程并行（tests/postgres_test_runner.py）。覆盖率只出报告、
      # 不设门槛，跟踪本身会明显拖慢测试，因此只在推送到 main 时收集，PR 不收集。
      - name: Run backend tests in isolated PostgreSQL databases
        env:
          DOTTY_TEST_COVERAGE: ${{ github.event_name == 'push' && '1' || '0' }}
        run: bash scripts/test-backend-postgres.sh

  # 聚合 job：ruleset 要求的必需检查名。只有全部矩阵分支成功它才成功，
  # 因此必需检查依然是真门禁，而不是被降级成摆设。
  #
  # 离线评测重放（evaluation.replay）也放在这里而不是 backend-matrix：它是纯函数、
  # 不需要 Postgres，且是确定性的——在两条矩阵分支里各跑一次只会产生两份完全相同的
  # 报告，浪费时间又重复上传 artifact。这个聚合 job 本来就只跑一次、且已经是
  # ruleset 要求的必需检查名，所以重放回归会直接让 "backend" 变红、阻止合并，
  # 而不只是产生一个未被强制的旁路信号。
  backend:
    runs-on: ubuntu-latest
    needs: [changes, backend-matrix]
    if: always()
    env:
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv
      # 后端未改动时矩阵被跳过，聚合视为通过，重放也无需再跑。
      BACKEND_RAN: ${{ needs.backend-matrix.result == 'success' }}
    steps:
      - name: Require every backend matrix leg to pass
        run: |
          changes='${{ needs.changes.result }}'
          result='${{ needs.backend-matrix.result }}'
          echo "changes result: $changes; backend-matrix result: $result"
          # 路径判断失败时矩阵也会是 skipped，必须先确认判断本身成功。
          test "$changes" = success
          test "$result" = success -o "$result" = skipped
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: env.BACKEND_RAN == 'true'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        if: env.BACKEND_RAN == 'true'
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        if: env.BACKEND_RAN == 'true'
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Install backend dependencies (frozen lock)
        if: env.BACKEND_RAN == 'true'
        working-directory: apps/api
        run: uv sync --frozen
      # 确定性金标准语料重放：纯函数、不触模型/数据库，作为真正的质量回归门禁。
      # judge.py/judge_cli.py/leaderboard.py 需要真实模型调用，不放进 CI（见
      # docs/runtime-governance-plan.md §G4 与 docs/engineering-roadmap.md）。
      - name: Replay deterministic golden-corpus evaluation
        if: env.BACKEND_RAN == 'true'
        working-directory: apps/api
        run: uv run python -m evaluation.replay --check
      - name: Upload evaluation replay report
        if: always() && env.BACKEND_RAN == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: eval-replay-report
          path: output/eval-reports
          if-no-files-found: warn

  frontend:
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.2
          cache: pnpm
      - name: Install backend dependencies (frozen lock, for OpenAPI export)
        working-directory: apps/api
        run: uv sync --frozen
      - name: Install frontend dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile
      - name: Lint frontend (eslint)
        working-directory: apps/web
        run: pnpm run lint
      - name: Unit tests (vitest)
        working-directory: apps/web
        # 覆盖率目前只出报告、不设门槛：先看真实分布，多数业务流程由 Playwright E2E
        # 覆盖，vitest 只测纯函数，因此总体行覆盖率低是预期的，不代表质量问题。
        run: npm run test:coverage
      - name: Verify generated API types
        working-directory: apps/web
        run: |
          # 让脚本解析到的 python3 携带后端依赖（venv 由上一步 uv sync 创建）
          export PATH="$GITHUB_WORKSPACE/apps/api/.venv/bin:$PATH"
          pnpm run check:api
      - name: Build frontend
        working-directory: apps/web
        run: pnpm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.e2e == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.22.2
          cache: pnpm
      - name: Install frontend dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Run Playwright E2E tests
        working-directory: apps/web
        run: pnpm run test:e2e
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    needs: [changes, backend, frontend]
    # 上游 frontend 被跳过时默认会连带跳过本 job，因此显式判断上游结果。
    if: >-
      always() && needs.changes.outputs.docker == 'true' && needs.backend.result == 'success'
      && (needs.frontend.result == 'success' || needs.frontend.result == 'skipped')
    env:
      POSTGRES_PASSWORD: ci-only-password
      WEB_PORT: "8080"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build Docker images
        run: docker compose build api web
      - name: Start Docker Compose stack
        run: docker compose up --detach
      - name: Verify web and API health
        run: |
          timeout 120 bash -c 'until curl --fail --silent http://127.0.0.1:8080/healthz; do sleep 2; done'
          curl --fail --silent http://127.0.0.1:8080/api/health
      - name: Print Docker logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop Docker Compose stack
        if: always()
        run: docker compose down --volumes

  feishu-notify:
    name: Notify Feishu
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e, docker]
    # 只在推送到 main（通常是合并后）时通知。PR 分支自身触发的运行结果已经在 GitHub
    # PR 页面可见，且合并后 main 上会用同一份代码重新跑一次；两者都发通知会重复。
    if: ${{ always() && github.event_name == 'push' }}
    steps:
      - name: Send CI result to Feishu
        uses: ningkaikok/feishu-notify-action@f9fe9c61b2d4a6a2d30a2409697088b8682072ea # v1
        with:
          webhook-url: ${{ secrets.FEISHU_WEBHOOK_URL }}
          webhook-secret: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
          title: "Dotty Tutor CI"
          results: >-
            {
              "后端测试": "${{ needs.backend.result }}",
              "前端构建": "${{ needs.frontend.result }}",
              "Playwright": "${{ needs.e2e.result }}",
              "Docker": "${{ needs.docker.result }}"
            }
