name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      # 与本地约定一致：虚拟环境固定在仓库根目录。
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      # 只用系统 Python（pyproject: python-preference=only-system），不下载解释器。
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install backend dependencies (frozen lock)
        working-directory: apps/api
        run: uv sync --frozen
      # 后续 ruff/pyright 步骤从仓库根调用，路径相对根解析
      - name: Lint backend (ruff)
        working-directory: apps/api
        run: uv run ruff check .
      - name: Type check (pyright)
        run: uv --directory apps/api run pyright
      - name: Run backend tests
        working-directory: apps/api
        env:
          DOTTY_DATA_DIR: ${{ runner.temp }}/dotty-data
        run: ${{ github.workspace }}/.venv/bin/python -m unittest discover -s tests -p 'test_*.py'

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: pnpm
      - name: Install backend dependencies (frozen lock, for OpenAPI export)
        working-directory: apps/api
        run: uv sync --frozen
      - name: Install frontend dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile
      - name: Lint frontend (eslint)
        working-directory: apps/web
        run: pnpm run lint
      - name: Unit tests (vitest)
        working-directory: apps/web
        run: npm run test
      - name: Verify generated API types
        working-directory: apps/web
        run: |
          # 让脚本解析到的 python3 携带后端依赖（venv 由上一步 uv sync 创建）
          export PATH="$GITHUB_WORKSPACE/apps/api/.venv/bin:$PATH"
          pnpm run check:api
      - name: Build frontend
        working-directory: apps/web
        run: pnpm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20
          cache: pnpm
      - name: Install frontend dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Run Playwright E2E tests
        working-directory: apps/web
        run: pnpm run test:e2e
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      POSTGRES_PASSWORD: ci-only-password
      WEB_PORT: "8080"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build Docker images
        run: docker compose build api web
      - name: Start Docker Compose stack
        run: docker compose up --detach
      - name: Verify web and API health
        run: |
          timeout 120 bash -c 'until curl --fail --silent http://127.0.0.1:8080/healthz; do sleep 2; done'
          curl --fail --silent http://127.0.0.1:8080/api/health
      - name: Print Docker logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop Docker Compose stack
        if: always()
        run: docker compose down --volumes

  feishu-notify:
    name: Notify Feishu
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e, docker]
    # 只在推送到 main（通常是合并后）时通知。PR 分支自身触发的运行结果已经在 GitHub
    # PR 页面可见，且合并后 main 上会用同一份代码重新跑一次；两者都发通知会重复。
    if: ${{ always() && github.event_name == 'push' }}
    steps:
      - name: Send CI result to Feishu
        uses: ningkaikok/feishu-notify-action@f9fe9c61b2d4a6a2d30a2409697088b8682072ea # v1
        with:
          webhook-url: ${{ secrets.FEISHU_WEBHOOK_URL }}
          webhook-secret: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
          title: "Dotty Tutor CI"
          results: >-
            {
              "后端测试": "${{ needs.backend.result }}",
              "前端构建": "${{ needs.frontend.result }}",
              "Playwright": "${{ needs.e2e.result }}",
              "Docker": "${{ needs.docker.result }}"
            }
