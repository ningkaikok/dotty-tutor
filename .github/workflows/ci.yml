name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run backend tests
        working-directory: backend
        env:
          DOTTY_DATA_DIR: ${{ runner.temp }}/dotty-data
        run: python -m unittest discover -s . -p 'test_*.py'

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      POSTGRES_PASSWORD: ci-only-password
      WEB_PORT: "8080"
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build Docker images
        run: docker compose build api web
      - name: Start Docker Compose stack
        run: docker compose up --detach
      - name: Verify web and API health
        run: |
          timeout 120 bash -c 'until curl --fail --silent http://127.0.0.1:8080/healthz; do sleep 2; done'
          curl --fail --silent http://127.0.0.1:8080/api/health
      - name: Print Docker logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop Docker Compose stack
        if: always()
        run: docker compose down --volumes
