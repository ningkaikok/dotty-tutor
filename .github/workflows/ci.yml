name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run backend tests
        working-directory: backend
        env:
          DOTTY_DATA_DIR: ${{ runner.temp }}/dotty-data
        run: python -m unittest discover -s tests -p 'test_*.py'

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install OpenAPI export dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Verify generated API types
        working-directory: frontend
        run: npm run check:api
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run Playwright E2E tests
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      POSTGRES_PASSWORD: ci-only-password
      WEB_PORT: "8080"
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build Docker images
        run: docker compose build api web
      - name: Start Docker Compose stack
        run: docker compose up --detach
      - name: Verify web and API health
        run: |
          timeout 120 bash -c 'until curl --fail --silent http://127.0.0.1:8080/healthz; do sleep 2; done'
          curl --fail --silent http://127.0.0.1:8080/api/health
      - name: Print Docker logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop Docker Compose stack
        if: always()
        run: docker compose down --volumes

  feishu-notify:
    name: Notify Feishu
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e, docker]
    # 只在推送到 main（通常是合并后）时通知。PR 分支自身触发的运行结果已经在 GitHub
    # PR 页面可见，且合并后 main 上会用同一份代码重新跑一次；两者都发通知会重复。
    if: ${{ always() && github.event_name == 'push' }}
    steps:
      - name: Send CI result to Feishu
        uses: ningkaikok/feishu-notify-action@v1
        with:
          webhook-url: ${{ secrets.FEISHU_WEBHOOK_URL }}
          webhook-secret: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
          title: "Dotty Tutor CI"
          results: >-
            {
              "后端测试": "${{ needs.backend.result }}",
              "前端构建": "${{ needs.frontend.result }}",
              "Playwright": "${{ needs.e2e.result }}",
              "Docker": "${{ needs.docker.result }}"
            }
